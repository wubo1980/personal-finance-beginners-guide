<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" fill="#F8FAFC" rx="12"/>
  <text x="300" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#1B4F72">High-Yield Savings vs Traditional Savings</text>
  <rect x="60" y="70" width="200" height="40" rx="6" fill="#E2E8F0"/>
  <text x="160" y="95" text-anchor="middle" font-family="monospace" font-size="14" fill="#1A202C">Traditional: 0.01% APY</text>
  <rect x="60" y="120" width="200" height="40" rx="6" fill="#27AE60" opacity="0.7"/>
  <text x="160" y="145" text-anchor="middle" font-family="monospace" font-size="14" fill="white">HYSA: 4.00-5.00% APY</text>
  <text x="60" y="200" font-family="Inter, sans-serif" font-size="13" fill="#718096">On $10,000 for 1 year:</text>
  <rect x="60" y="215" width="200" height="30" rx="4" fill="#E2E8F0"/>
  <text x="160" y="235" text-anchor="middle" font-family="monospace" font-size="13" fill="#1A202C">Traditional: ~$1 earned</text>
  <rect x="60" y="252" width="200" height="30" rx="4" fill="#27AE60" opacity="0.7"/>
  <text x="160" y="272" text-anchor="middle" font-family="monospace" font-size="13" fill="white">HYSA: ~$400-500 earned</text>
  <text x="340" y="95" font-family="Inter, sans-serif" font-size="13" fill="#1A202C">Difference on $5,000:</text>
  <text x="340" y="120" font-family="monospace" font-size="20" font-weight="700" fill="#27AE60">$200 - $250/year</text>
  <text x="340" y="145" font-family="Inter, sans-serif" font-size="12" fill="#718096">Zero extra effort</text>
</svg>

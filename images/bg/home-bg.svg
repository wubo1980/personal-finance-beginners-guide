<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="h1" x1="200" y1="300" x2="1000" y2="600">
      <stop stop-color="#1B4F72" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#5DADE2" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="h2" x1="400" y1="500" x2="800" y2="200">
      <stop stop-color="#F39C12" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#27AE60" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- Horizon -->
  <path d="M80 520h1040" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Central compass-like focal point -->
  <circle cx="600" cy="340" r="120" stroke="url(#h1)" stroke-width="2" stroke-dasharray="6 8"/>
  <circle cx="600" cy="340" r="80" stroke="url(#h1)" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="600" cy="340" r="16" stroke="url(#h1)" stroke-width="3"/>
  <!-- Compass needles -->
  <path d="M600 340L540 220" stroke="url(#h1)" stroke-width="4" stroke-linecap="round"/>
  <path d="M600 340L660 200" stroke="url(#h2)" stroke-width="4" stroke-linecap="round"/>
  <path d="M600 340L700 250" stroke="url(#h2)" stroke-width="3" stroke-linecap="round"/>
  <!-- Branching paths -->
  <path d="M600 420C600 480 400 500 240 540" stroke="url(#h2)" stroke-width="3" stroke-linecap="round"/>
  <path d="M600 420C600 480 720 510 900 540" stroke="url(#h1)" stroke-width="3" stroke-linecap="round"/>
  <path d="M600 420C600 480 600 520 600 560" stroke="#1B4F72" stroke-width="3" stroke-linecap="round" stroke-opacity="0.3"/>
  <!-- Small decorative dots along paths -->
  <circle cx="240" cy="540" r="4" fill="#F39C12" fill-opacity="0.5"/>
  <circle cx="900" cy="540" r="4" fill="#1B4F72" fill-opacity="0.4"/>
  <circle cx="600" cy="560" r="4" fill="#27AE60" fill-opacity="0.5"/>
  <!-- Subtle background circles -->
  <circle cx="200" cy="180" r="60" stroke="#1B4F72" stroke-width="1" stroke-opacity="0.15"/>
  <circle cx="1000" cy="280" r="80" stroke="#F39C12" stroke-width="1" stroke-opacity="0.12"/>
  <circle cx="350" cy="650" r="40" stroke="#27AE60" stroke-width="1" stroke-opacity="0.1"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="d1" x1="200" y1="150" x2="1000" y2="650">
      <stop stop-color="#F39C12" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#1B4F72" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#27AE60" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- Tangled knot (left side) - representing debt -->
  <path d="M280 340C250 280 300 230 360 260C420 290 400 360 350 390C300 420 240 380 260 330C280 290 330 280 370 310" stroke="url(#d1)" stroke-width="3" stroke-linecap="round"/>
  <!-- Middle section - knot beginning to loosen -->
